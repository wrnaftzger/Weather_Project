name: Upload Forecast Data to DB


on:
  workflow_run:
    workflows: ["Run Weather Data Script"]  # Must match the 'name:' in weather.yml exactly
    types:
      - completed
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  upload-to-db:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # Run if triggered manually, or if the weather workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        run: pip install pandas sqlalchemy pyodbc 
        
      - name: Test SQL connectivity
        run: nc -zv sluweather.database.windows.net 1433

      - name: Run DB upload script
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python scripts/scrapedtodb.py