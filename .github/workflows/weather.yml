name: Run Weather Data Script
on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours (UTC)
  workflow_dispatch:         # manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # allow workflow to commit changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pandas requests pyodbc sqlalchemy python-dotenv
      
      - name: Run weather scraping script
        run: python weather_data_collector.py
      
      - name: Upload newly scraped data to SQL Server
        env:
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: python scrapedtodb.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Forecast_Data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update weather data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push