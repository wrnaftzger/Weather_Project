name: Update Historical Weather Data

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM UTC
  workflow_dispatch:      # Manual trigger

jobs:
  update-historical-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install pandas requests

      - name: Run daily weather update
        run: |
          python scripts/historical_weather.py

      - name: Upload backup files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-weather-backup
          path: data/weather/Historical_Weather_Data_*.csv
          if-no-files-found: ignore
          retention-days: 7