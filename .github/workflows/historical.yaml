name: Update Historical Weather Data

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write  # Required for committing & pushing

jobs:
  update-historical-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install pandas requests

      - name: Run daily weather update
        run: python scripts/historical_weather.py

      - name: Commit & push CSVs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/historical_zips/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update historical weather - $(date -u +'%Y-%m-%d UTC')"
          git push

      - name: Upload backup files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-weather-backup
          path: data/historical_zips/Historical_Weather_Data_*.csv
          if-no-files-found: ignore
          retention-days: 7